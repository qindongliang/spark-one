<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SparkOne SQL</title>
  <link rel="stylesheet" href="/webjars/codemirror/5.65.19/lib/codemirror.css">
  <link rel="stylesheet" href="/webjars/codemirror/5.65.19/theme/idea.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section class="login-screen" id="login-screen" hidden>
    <form class="login-form" id="login-form">
      <h1>SparkOne SQL</h1>
      <label for="username">Username</label>
      <div class="login-fields">
        <input id="username" name="username" maxlength="64" autocomplete="username" required>
        <button class="primary" type="submit">Continue</button>
      </div>
      <div class="login-error" id="login-error" role="alert"></div>
    </form>
  </section>
  <div class="workspace" id="workspace" hidden>
    <header>
      <h1>SparkOne SQL</h1>
      <div class="header-actions">
        <span class="current-user" id="current-user"></span>
        <button id="logout" type="button">Log out</button>
        <div class="status" id="status">Ready</div>
      </div>
    </header>
    <main>
      <section class="pane">
        <div class="toolbar">
          <label>Engine <select id="engine"></select></label>
          <button id="compile" hidden>Compile</button>
          <button class="primary" id="run">Run</button>
        </div>
        <textarea id="script" spellcheck="false">view users as
select * from values
  ('beijing', 1),
  ('shanghai', 2),
  ('beijing', 3)
as users(city, id);

view city_stats as
select city, count(*) as cnt
from users
group by city;

select * from city_stats order by city;</textarea>
      </section>
      <section class="pane">
        <div class="toolbar">
          <div class="status" id="summary">No result</div>
          <label class="rows-control">Rows <input id="limit" type="number" min="1" max="10" value="10"></label>
        </div>
        <div class="output" id="output"></div>
      </section>
    </main>
  </div>
  <script src="/webjars/codemirror/5.65.19/lib/codemirror.js"></script>
  <script src="/webjars/codemirror/5.65.19/mode/sql/sql.js"></script>
  <script src="/app.js"></script>
</body>
</html>
